<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Tabela</title>
    <style>

        table{ width: 300px;
            

        }

        td { border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        td.branco {
            background-color: white;
        }

        tr {
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.171);
            background-color: blanchedalmond;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td>1</td>
            <td>2</td>
            <td rowspan="2">3</td>
            <td>4</td>
        </tr>

        <tr>
            <td>5</td>
            <td>6</td>
            <td>7</td>
        </tr>

        <tr>
            <td colspan="3">8</td>
        <td>9</td>
        </tr>

        <tr>
            <td rowspan="2">10</td>
            <td colspan="2">11</td>
            <td>12</td>
        </tr>
        
        <tr>
            <td>13</td>
            <td>14</td>
            <td>15</td>
        </tr>



        <table>
            <tr>
                <td colspan="4" class="branco">A</td>
                <td rowspan="4" class="branco">B</td>

            </tr>

            <tr>
                <td rowspan="4" class="branco">C</td>
                <td>D</td>
                <td>E</td>

                <td>F</td>
            </tr>

            <tr>
                <td>G</td>
                <td>H</td>
                <td>I</td>
            </tr>

            <tr>
                <td>J</td>
                <td>L</td>
                <td>M</td>
            </tr>

            <tr>
                <td colspan="4" class="branco">N</td>
            </tr>


        </table>

    </table>
</body>
</html>
