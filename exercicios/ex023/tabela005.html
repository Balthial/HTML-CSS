<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercício de tabela</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;

        }

        table {
            border-collapse: collapse;
            width: 500px;
        }

        caption {
            font-size: 1.3em;
            font-weight: bold;
            padding: 10px;
        }

        th, td {
            border: 2px solid black;
            padding: 10px;
        }

        th {
            background-color: aqua;
        }

        .destaque {
            background-color: greenyellow;
        }

        col.cnome {
            background-color: cadetblue;
        }

    </style>
</head>
<body>
    <h1>Exercício de Tabela</h1>

    <table>
        <colgroup>
        <col class="cnome"> 
        <col class="csexo"> 
        <col class="cidade"> 
        <col class="cprof"> 
        </colgroup>

        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>

        </tr>

        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>
        <tr>
            <td>Mario</td>
            <td>M</td>
            <td>50</td>
            <td>Encanador</td>
        </tr>
        <tr>
            <td>Juliet</td>
            <td>F</td>
            <td>15</td>
            <td>Estudante</td>
        </tr>
        <tr>
            <td>Peter J Parker</td>
            <td>M</td>
            <td>25</td>
            <td>Super Heroi</td>
        </tr>
        <tr>
            <td>J J Jameson</td>
            <td>M</td>
            <td>56</td>
            <td>Jornalista</td>
        </tr>
        <tr>
            <td>Martha</td>
            <td>F</td>
            <td>46</td>
            <td>Mãe do Batman</td>
        </tr>
    </table>
</body>
</html>
