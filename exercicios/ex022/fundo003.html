<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posição de Fundos</title>
    <style>
        div.bloco {
            border:  3px solid black;
            box-shadow: 2px 2px 2px rgba(0, 0, 0, 0.281);
            height: 200px;
            border-radius: 10px;
            margin: 10px;
            background-image: url(imagem/wallpaper003.jpg);
        }

        div#q1 {
    background-position: left top;
        }

        div#q2 {
    background-position: left center;
        }

        div#q3 {
            background-position: right bottom;
        }

        div#q4 {
            background-position: center center;
        }
    </style>
</head>
<body>
    <div class="bloco" id="q1"></div>
    <div class="bloco" id="q2"></div>
    <div class="bloco" id="q3"></div>
    <div class="bloco" id="q4"></div>
</body>
</html>
