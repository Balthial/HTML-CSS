<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
</head>
<style>
body {
    font-family: Arial, Helvetica, sans-serif;

}
a {
    color: brown;
    text-decoration: none;
    font-weight: bold;
}

a:visited {
    color: blue;
}
a:hover {
    text-decoration: underline;
}
a:active {
    color: yellowgreen;
}

a::after {
    content: '⇐';

}

a::before {
    content: '⇒' ;
}
</style>
<body>
    
<h1>Personalizando Links</h1>
<ul>
<li><a href="https://gustavoguanabara.github.io/" target="_blank">Repositório GitHub</a></li>
<li><a href="https://www.youtube.com/watch?v=vMlrcOVr7po" target="_blank">Canal do YT</a></li>
<li><a href="https://www.cursoemvideo.com" target="_blank">Site do Curso em Vídeo</a></li>

</ul>
</body>
</html>
